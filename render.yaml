services:
  - type: web
    name: prototype-creator
    env: python
    rootDir: .
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FIGMA_TOKEN
        sync: false
      - key: SERVICE_KEY
        sync: false
      - key: REQUEST_TIMEOUT_SECONDS
        value: "20"
